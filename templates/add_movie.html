<!DOCTYPE html>
<html lang="ru" data-bs-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Добавить фильм</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body">
    
    <nav class="navbar bg-body-tertiary border-bottom mb-4">
        <div class="container">
            <a href="/" class="navbar-brand text-decoration-none text-white fs-2" style="font-weight: 900; letter-spacing: -1px;">
     Кино<span style="color: #e50914; font-weight: 900;">мания</span>
</a>
        </div>
    </nav>

    <div class="container" style="max-width: 600px;">
        <h2 class="mb-4">Добавление нового фильма</h2>
        
        <div class="card shadow border-secondary">
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Название фильма</label>
                        <input type="text" name="title" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Описание</label>
                        <textarea name="description" class="form-control" rows="3" required></textarea>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Рейтинг (например, 8.6)</label>
                            <input type="number" step="0.1" min="0" max="10" name="rating" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Жанр (например, Комедия)</label>
                            <input type="text" name="genre" class="form-control" placeholder="Фантастика, Боевик" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Ссылка на трейлер (YouTube embed)</label>
                        <input type="url" name="video_url" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Ссылка на постер (URL картинки)</label>
                        <input type="url" name="poster_url" class="form-control" required>
                    </div>
                    <hr class="border-secondary my-4">
                    <h5 class="mb-3 text-warning">Актерский состав (до 3-х человек)</h5>
                    
                    {% for i in range(1, 4) %}
                    <div class="row g-2 mb-3 border-bottom border-dark pb-2">
                        <div class="col-md-6">
                            <label class="form-label small text-muted">Актер {{ i }} — Имя</label>
                            <input type="text" name="actor{{ i }}_name" class="form-control form-control-sm" placeholder="Имя Фамилия">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small text-muted">Актер {{ i }} — URL фото</label>
                            <input type="url" name="actor{{ i }}_photo" class="form-control form-control-sm" placeholder="https://...">
                        </div>
                    </div>
                    {% endfor %}
                    <button type="submit" class="btn btn-success w-100">Добавить в базу</button>
                </form>
            </div>
        </div>
    </div>

</body>
</html>
